# The stack's infrastructure (docs/architecture/compose-base.md, WP3.1). Started by `just up`, which
# unseals the secrets, prepares the CA (deploy/ca/ca.py) and runs the bootstrap step first; a bare
# `docker compose up` lacks all three. Every service that reads a secret or a certificate runs as
# the stack user (AETHERSPARK_UID/GID; the WSL user on the desktop).
name: aetherspark

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  user: "${AETHERSPARK_UID:-1000}:${AETHERSPARK_GID:-1000}"

# Services that read a secret do not restart by themselves: their secrets live only in memory, so
# after a restart of WSL or Docker they cannot start, and Docker would create empty root-owned
# folders where the secret files belong, which the next unseal cannot replace (seen 2026-11-09).
# `just up` unseals and starts them again.
x-no-restart: &no-restart
  restart: "no"

# step-ca, the bootstrap step and the renewers share one image, built from step-ca/Dockerfile (its
# FROM line is the only pin; deploy/ca/ca.py reads it too)
x-step: &step
  <<: *hardening
  build: ./step-ca
  image: aetherspark/step-ca:local
  tmpfs: [/tmp]
  environment:
    HOME: /tmp
    STEPPATH: /tmp/.step
    CA_URL: "https://step-ca.svc.aether.${AETHERSPARK_PLACE:-localhost}:9000"
  mem_limit: 256m
  pids_limit: 200

# The CA's certificates only (root and intermediate), never its key or configuration
x-ca-certs: &ca-certs
  type: volume
  source: step-ca
  target: /ca-certs
  read_only: true
  volume: { subpath: certs }

services:
  step-ca:
    <<: [*no-restart, *step]
    labels: { aetherspark.role: step-ca }
    entrypoint: ["step-ca"]
    command: ["/ca/config/ca.json", "--password-file", "/run/secrets/step-ca-password"]
    environment:
      HOME: /tmp
      STEPPATH: /ca
    secrets: [step-ca-password]
    volumes: ["step-ca:/ca"]
    networks:
      pki:
        aliases: ["step-ca.svc.aether.${AETHERSPARK_PLACE:-localhost}"]
    healthcheck:
      test: ["CMD", "step", "ca", "health", "--ca-url", "https://step-ca.svc.aether.${AETHERSPARK_PLACE:-localhost}:9000", "--root", "/ca/certs/root_ca.crt"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

  # One-shot, run by `just up` before the services: a certificate for each service that has none
  # or an expired one, with that service's JWK provisioner (its password is read here only)
  cert-bootstrap:
    <<: *step
    profiles: [bootstrap]
    restart: "no"
    labels: { aetherspark.role: cert-renewer }
    entrypoint: ["sh", "/bootstrap.sh"]
    environment:
      HOME: /tmp
      STEPPATH: /tmp/.step
      CA_URL: "https://step-ca.svc.aether.${AETHERSPARK_PLACE:-localhost}:9000"
      PLACE: "${AETHERSPARK_PLACE:-localhost}"
      SERVICES: postgres-auth keycloak forward-auth whoami
    secrets: [step-ca-provisioner-postgres-auth, step-ca-provisioner-keycloak, step-ca-provisioner-forward-auth, step-ca-provisioner-whoami]
    volumes:
      - ./cert-bootstrap.sh:/bootstrap.sh:ro
      - *ca-certs
      - postgres-auth-tls:/tls/postgres-auth
      - keycloak-tls:/tls/keycloak
      - forward-auth-tls:/tls/forward-auth
      - whoami-tls:/tls/whoami
    networks: [pki]
    depends_on:
      step-ca: { condition: service_healthy }

  # Renews postgres-auth's certificate at two thirds of its lifetime, authenticated by the current
  # certificate (mTLS), with no password; postgres-auth reads the files from the shared volume
  postgres-auth-renewer: &renewer
    <<: *step
    labels: { aetherspark.role: cert-renewer }
    entrypoint: ["step"]
    command: ["ca", "renew", "--daemon", "--ca-url", "https://step-ca.svc.aether.${AETHERSPARK_PLACE:-localhost}:9000", "--root", "/ca-certs/root_ca.crt", "/tls/tls.crt", "/tls/tls.key"]
    volumes:
      - *ca-certs
      - postgres-auth-tls:/tls
    networks: [pki]
    depends_on:
      step-ca: { condition: service_healthy }
    # step-ca backdates each certificate by a minute, and the daemon renews when a third of that
    # lifetime is left, minus up to a twentieth as jitter: never below 28 %. Below 25 % the renewal is
    # overdue; after a stop past that point the renewer is healthy only once it has renewed (C9a).
    # `--expires-in 75%` means "more than 75 % of the life has passed", so less than 25 % is left
    healthcheck:
      test: ["CMD", "sh", "-c", "step certificate needs-renewal /tls/tls.crt --expires-in 75% >/dev/null 2>&1; [ $$? -eq 1 ]"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 1s

  # The same for Keycloak's certificate; Keycloak re-reads the files itself (hourly)
  keycloak-renewer:
    <<: *renewer
    volumes:
      - *ca-certs
      - keycloak-tls:/tls

  # The same for forward-auth's and the test page's; cert-watch.sh restarts them on a new certificate
  forward-auth-renewer:
    <<: *renewer
    volumes:
      - *ca-certs
      - forward-auth-tls:/tls

  whoami-renewer:
    <<: *renewer
    volumes:
      - *ca-certs
      - whoami-tls:/tls

  # Keycloak's own database server (decision 5): the official image (Alpine, zlib fixed; its FROM line
  # is the pin) with this repository's start script (postgres-auth/run.sh says why not the image's),
  # TLS from the renewer's volume, the reviewed pg_hba.conf, on db-auth only
  postgres-auth:
    <<: [*no-restart, *hardening]
    build: ./postgres-auth
    image: aetherspark/postgres-auth:local
    labels: { aetherspark.role: postgres }
    entrypoint: ["bash", "/postgres-auth/run.sh"]
    environment:
      AETHERSPARK_PG_RELOAD_SECONDS: "${AETHERSPARK_PG_RELOAD_SECONDS:-3600}"
    secrets: [postgres-auth-superuser-password, keycloak-db-password]
    tmpfs:
      - /tmp
      - "/var/run/postgresql:uid=${AETHERSPARK_UID:-1000},gid=${AETHERSPARK_GID:-1000},mode=0700"
    shm_size: 128m
    mem_limit: 512m
    pids_limit: 200
    volumes:
      - ./postgres-auth:/postgres-auth:ro
      # nocopy: Docker copies nothing into it, so the folder stays the stack user's (`ca volumes`)
      - { type: volume, source: postgres-auth-data, target: /var/lib/postgresql, volume: { nocopy: true } }
      - postgres-auth-tls:/tls:ro
    networks:
      db-auth:
        aliases: ["postgres-auth.svc.aether.${AETHERSPARK_PLACE:-localhost}"]
    depends_on:
      postgres-auth-renewer: { condition: service_healthy }
    # Healthy once the keycloak role and database are in place, not merely once the server answers
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /tmp/ready && pg_isready -q -h /var/run/postgresql -d postgres -U postgres"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 1s

  # Keycloak (compose-base.md, "Keycloak exposure"): built from Ostium's notice (deploy/keycloak),
  # production start, reached only by Traefik on auth-front; its database over verified TLS on
  # db-auth. Its two passwords come from one configuration file in the in-memory secrets folder
  # (Keycloak has no *_FILE variables); everything else here is not secret.
  keycloak:
    <<: [*no-restart, *hardening]
    build: ../../keycloak
    image: aetherspark/keycloak:local
    labels: { aetherspark.role: keycloak }
    command: ["--config-file=/run/secrets/keycloak.conf", "start", "--optimized", "--import-realm"]
    environment:
      KC_HOSTNAME: "https://auth.aether.${AETHERSPARK_PLACE:-localhost}"
      KC_HOSTNAME_ADMIN: "https://auth-admin.aether.${AETHERSPARK_PLACE:-localhost}"
      # HTTPS only, on its auth-front address only: not even postgres-auth on db-auth reaches it
      KC_HTTP_ENABLED: "false"
      KC_HTTP_HOST: 172.30.61.3
      KC_HTTPS_PORT: "8443"
      KC_HTTPS_PROTOCOLS: TLSv1.3,TLSv1.2
      KC_HTTPS_CERTIFICATE_FILE: /tls/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /tls/tls.key
      KC_HTTPS_CERTIFICATES_RELOAD_PERIOD: "${AETHERSPARK_KC_RELOAD_PERIOD:-1h}"
      # Health on the container's own loopback only, plain HTTP, never routed
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_HTTP_MANAGEMENT_HOST: 127.0.0.1
      # Forwarded headers count only from Traefik's pinned auth-front address
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: 172.30.61.2
      KC_DB_URL: "jdbc:postgresql://postgres-auth.svc.aether.${AETHERSPARK_PLACE:-localhost}:5432/keycloak?sslmode=verify-full&sslrootcert=/ca-certs/root_ca.crt"
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      # The realm file's place, filled in by the import (its clients' addresses); not secret. The
      # clients' secret placeholders have no variable here on purpose: `just keycloak apply` sets
      # the secrets from the store (admin.py, secret_placeholder).
      AETHERSPARK_PLACE: "${AETHERSPARK_PLACE:-localhost}"
      # One node: no cluster discovery and no cluster ports (the build sets it too)
      KC_CACHE: local
    secrets: [keycloak.conf]
    tmpfs:
      - /tmp
      - "/opt/keycloak/data:uid=${AETHERSPARK_UID:-1000},gid=${AETHERSPARK_GID:-1000},mode=0700"
    mem_limit: 1g
    pids_limit: 400
    volumes:
      - ../../keycloak/aetherspark-realm.json:/opt/keycloak/data/import/aetherspark-realm.json:ro
      - keycloak-tls:/tls:ro
      - *ca-certs
    networks:
      auth-front:
        ipv4_address: 172.30.61.3
        aliases: ["keycloak.svc.aether.${AETHERSPARK_PLACE:-localhost}"]
      db-auth: {}
    depends_on:
      postgres-auth: { condition: service_healthy }
      keycloak-renewer: { condition: service_healthy }
    healthcheck:
      # The image has no curl: bash's /dev/tcp (Keycloak refuses a request without a Host line).
      # Ready answers 200; not ready 503 (a single check's "UP" in the body would not prove it)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '^HTTP/1.1 200 '"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      start_interval: 2s

  # Gate G3's sign-in helper (compose-base.md, "Gate G3's test relying party"): oauth2-proxy behind
  # Traefik's forwardAuth. It sends a browser without a session to Keycloak's sign-in (the public
  # name), and redeems the code and fetches the keys through Traefik's back-channel entrypoint (the
  # internal name), while checking that tokens name the public issuer. Every option is here; its two
  # secrets come from files. cert-watch.sh restarts it when its 24-hour certificate is renewed.
  forward-auth:
    <<: [*no-restart, *hardening]
    build: ./forward-auth
    image: aetherspark/forward-auth:local
    labels: { aetherspark.role: ui-api }
    entrypoint: ["sh", "/cert-watch/cert-watch.sh", "/tls/tls.crt", "oauth2-proxy"]
    command:
      - --provider=oidc
      - --provider-display-name=AetherSpark
      - --client-id=forward-auth
      - --client-secret-file=/run/secrets/forward-auth-client-secret
      - --cookie-secret-file=/run/secrets/forward-auth-cookie-secret
      - --cookie-name=_aetherspark_g3
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --oidc-issuer-url=https://auth.aether.${AETHERSPARK_PLACE:-localhost}/realms/aetherspark
      - --skip-oidc-discovery
      - --login-url=https://auth.aether.${AETHERSPARK_PLACE:-localhost}/realms/aetherspark/protocol/openid-connect/auth
      - --redeem-url=https://auth-backchannel.aether.${AETHERSPARK_PLACE:-localhost}:9443/realms/aetherspark/protocol/openid-connect/token
      - --oidc-jwks-url=https://auth-backchannel.aether.${AETHERSPARK_PLACE:-localhost}:9443/realms/aetherspark/protocol/openid-connect/certs
      - --provider-ca-file=/ca-certs/root_ca.crt
      - --code-challenge-method=S256
      - --redirect-url=https://whoami.aether.${AETHERSPARK_PLACE:-localhost}/oauth2/callback
      - --whitelist-domain=whoami.aether.${AETHERSPARK_PLACE:-localhost}
      # Users have no email (AetherSpark sends none): the username stands in for it
      - --email-domain=*
      - --oidc-email-claim=preferred_username
      - --insecure-oidc-allow-unverified-email
      - --skip-provider-button
      # forwardAuth: an answer for the request Traefik asks about, and the user in response headers
      - --upstream=static://202
      - --set-xauthrequest
      - --reverse-proxy
      - --trusted-proxy-ip=172.30.63.2
      - --http-address=
      - --https-address=:4443
      - --tls-cert-file=/tls/tls.crt
      - --tls-key-file=/tls/tls.key
      # The callback's URL carries the one-time authorization code: not in the request log
      - --exclude-logging-path=/oauth2/callback
    environment:
      CERT_WATCH_SECONDS: "${AETHERSPARK_CERT_WATCH_SECONDS:-60}"
    secrets: [forward-auth-client-secret, forward-auth-cookie-secret]
    healthcheck:
      # Inside the container only; its certificate names the internal name, not 127.0.0.1
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1:4443/ping"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s
    tmpfs: [/tmp]
    mem_limit: 128m
    pids_limit: 100
    volumes:
      - ./cert-watch:/cert-watch:ro
      - forward-auth-tls:/tls:ro
      - *ca-certs
    networks:
      edge:
        aliases: ["forward-auth.svc.aether.${AETHERSPARK_PLACE:-localhost}"]
      auth-edge: {}
    depends_on:
      forward-auth-renewer: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  # Gate G3's test page: echoes the request, so it shows the user forward-auth put into it
  whoami:
    <<: *hardening
    build: ./whoami
    image: aetherspark/whoami:local
    labels: { aetherspark.role: ui-api }
    entrypoint: ["sh", "/cert-watch/cert-watch.sh", "/tls/tls.crt", "whoami"]
    command: ["-port", "8443", "-cert", "/tls/tls.crt", "-key", "/tls/tls.key", "-name", "AetherSpark G3"]
    environment:
      CERT_WATCH_SECONDS: "${AETHERSPARK_CERT_WATCH_SECONDS:-60}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1:8443/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s
    tmpfs: [/tmp]
    mem_limit: 64m
    pids_limit: 50
    volumes:
      - ./cert-watch:/cert-watch:ro
      - whoami-tls:/tls:ro
    networks:
      edge:
        aliases: ["whoami.svc.aether.${AETHERSPARK_PLACE:-localhost}"]
    depends_on:
      whoami-renewer: { condition: service_healthy }

  traefik:
    <<: *hardening
    image: traefik:v3.7.17@sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a
    labels: { aetherspark.role: traefik }
    # 443 inside the container without a capability: the port floor of its own network namespace
    sysctls: { net.ipv4.ip_unprivileged_port_start: 443 }
    tmpfs:
      - /tmp
      # Traefik's ACME account and certificates live in memory; a restart orders new ones
      - "/acme:uid=${AETHERSPARK_UID:-1000},gid=${AETHERSPARK_GID:-1000},mode=0700"
    mem_limit: 256m
    pids_limit: 200
    # Static configuration from the environment only (Traefik reads one source; no file, no flags)
    environment:
      TRAEFIK_GLOBAL_CHECKNEWVERSION: "false"
      TRAEFIK_GLOBAL_SENDANONYMOUSUSAGE: "false"
      TRAEFIK_LOG_LEVEL: INFO
      TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS: ":443"
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS: "true"
      # Refuse encoded path characters, so no encoded variant slips past a path rule (Keycloak's
      # admin paths, PR 5), and headers that alias another header's name
      TRAEFIK_GLOBAL_ALIASHEADERSSTRATEGY: reject
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_ENCODEDCHARACTERS_ALLOWENCODEDSLASH: "false"
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_ENCODEDCHARACTERS_ALLOWENCODEDBACKSLASH: "false"
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_ENCODEDCHARACTERS_ALLOWENCODEDNULLCHARACTER: "false"
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_ENCODEDCHARACTERS_ALLOWENCODEDSEMICOLON: "false"
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_ENCODEDCHARACTERS_ALLOWENCODEDPERCENT: "false"
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_ENCODEDCHARACTERS_ALLOWENCODEDQUESTIONMARK: "false"
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_ENCODEDCHARACTERS_ALLOWENCODEDHASH: "false"
      # The back-channel entrypoint (forward-auth.yml): services reach Keycloak's protocol paths here,
      # on auth-edge only (an allowlist of its subnet); never published
      TRAEFIK_ENTRYPOINTS_BACKCHANNEL_ADDRESS: ":9443"
      TRAEFIK_ENTRYPOINTS_BACKCHANNEL_HTTP_TLS: "true"
      TRAEFIK_ENTRYPOINTS_BACKCHANNEL_HTTP_ENCODEDCHARACTERS_ALLOWENCODEDSLASH: "false"
      TRAEFIK_ENTRYPOINTS_BACKCHANNEL_HTTP_ENCODEDCHARACTERS_ALLOWENCODEDBACKSLASH: "false"
      TRAEFIK_ENTRYPOINTS_BACKCHANNEL_HTTP_ENCODEDCHARACTERS_ALLOWENCODEDNULLCHARACTER: "false"
      TRAEFIK_ENTRYPOINTS_BACKCHANNEL_HTTP_ENCODEDCHARACTERS_ALLOWENCODEDSEMICOLON: "false"
      TRAEFIK_ENTRYPOINTS_BACKCHANNEL_HTTP_ENCODEDCHARACTERS_ALLOWENCODEDPERCENT: "false"
      TRAEFIK_ENTRYPOINTS_BACKCHANNEL_HTTP_ENCODEDCHARACTERS_ALLOWENCODEDQUESTIONMARK: "false"
      TRAEFIK_ENTRYPOINTS_BACKCHANNEL_HTTP_ENCODEDCHARACTERS_ALLOWENCODEDHASH: "false"
      TRAEFIK_ENTRYPOINTS_PING_ADDRESS: ":8082"
      TRAEFIK_PING: "true"
      TRAEFIK_PING_ENTRYPOINT: ping
      TRAEFIK_PROVIDERS_FILE_DIRECTORY: /etc/traefik/dynamic
      TRAEFIK_PROVIDERS_FILE_WATCH: "false"
      TRAEFIK_CERTIFICATESRESOLVERS_STEPCA_ACME_CASERVER: "https://step-ca.svc.aether.${AETHERSPARK_PLACE:-localhost}:9000/acme/traefik/directory"
      TRAEFIK_CERTIFICATESRESOLVERS_STEPCA_ACME_CACERTIFICATES: /ca-certs/root_ca.crt
      TRAEFIK_CERTIFICATESRESOLVERS_STEPCA_ACME_CASYSTEMCERTPOOL: "false"
      # Hours; matches step-ca's 24-hour certificates (the default of 90 days would not)
      TRAEFIK_CERTIFICATESRESOLVERS_STEPCA_ACME_CERTIFICATESDURATION: "${AETHERSPARK_TRAEFIK_CERT_HOURS:-24}"
      TRAEFIK_CERTIFICATESRESOLVERS_STEPCA_ACME_STORAGE: /acme/acme.json
      TRAEFIK_CERTIFICATESRESOLVERS_STEPCA_ACME_TLSCHALLENGE: "true"
      AETHERSPARK_PLACE: "${AETHERSPARK_PLACE:-localhost}"
      # The only source the Keycloak admin route admits (keycloak.yml); see compose-base.md
      AETHERSPARK_ADMIN_SOURCE: "${AETHERSPARK_ADMIN_SOURCE:-172.30.30.1/32}"
    volumes:
      # Traefik reads the folder recursively; the tests add their route under dynamic/test/
      - ./traefik/dynamic:/etc/traefik/dynamic/stack:ro
      - *ca-certs
    ports:
      - { target: 443, published: "443", host_ip: "${AETHERSPARK_PUBLISH_ADDRESS:-127.0.0.1}", protocol: tcp }
    networks:
      ingress: {}
      # Keycloak's only caller; Keycloak trusts forwarded headers from this address only
      auth-front:
        ipv4_address: 172.30.61.2
      # The apps' network: forward-auth and the test page; forward-auth trusts forwarded headers from
      # this address only
      edge:
        ipv4_address: 172.30.63.2
      # The back-channel entrypoint's network: services reach Keycloak's protocol paths by this name
      auth-edge:
        ipv4_address: 172.30.62.2
        aliases: ["auth-backchannel.aether.${AETHERSPARK_PLACE:-localhost}"]
      # Its names, so step-ca's TLS-ALPN challenge reaches it (and nothing else claims them)
      pki:
        aliases:
          - "auth.aether.${AETHERSPARK_PLACE:-localhost}"
          - "auth-admin.aether.${AETHERSPARK_PLACE:-localhost}"
          - "whoami.aether.${AETHERSPARK_PLACE:-localhost}"
          - "auth-backchannel.aether.${AETHERSPARK_PLACE:-localhost}"
    depends_on:
      step-ca: { condition: service_healthy }
    healthcheck:
      # No flags: a flag would make Traefik ignore its environment, and with it the ping entrypoint
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

  # The backup job (docs/architecture/backup-job.md): one-shot restic runs, never a standing
  # service (profile `backup`, ADR-0003 note of 2026-11-11), started by deploy/backup/backup.sh.
  # On `backup` only, the one network with a way out to the backup target; the target by its
  # address, so no name lookups. The repository's address with the login, and AetherSpark's key's
  # password, come from files only. The in-memory staging folder holds the CA copy and the
  # Keycloak dump; the sealed store and the local folder feed of Ostium's packages (WP3.5,
  # ostium-packages.md) are read-only. The paths inside are fixed (A-015, condition c).
  # restic is built here from its source (deploy/backup/Dockerfile: the release image's libraries are
  # old). The staging folder and the feed must exist (backup.sh makes them): Docker would create
  # them as root.
  backup:
    <<: [*no-restart, *hardening]
    build: ../../backup
    image: aetherspark/restic:local
    labels: { aetherspark.role: restic }
    profiles: [backup]
    user: "${AETHERSPARK_UID:-1000}:${AETHERSPARK_GID:-1000}"
    environment:
      RESTIC_REPOSITORY_FILE: /run/secrets/backup-repository
      RESTIC_PASSWORD_FILE: /run/secrets/backup-key-password
      RESTIC_CACHE_DIR: /cache
    secrets: [backup-repository, backup-key-password]
    tmpfs:
      - "/cache:uid=${AETHERSPARK_UID:-1000},gid=${AETHERSPARK_GID:-1000},mode=0700"
      - /tmp
    volumes:
      - type: bind
        source: "${AETHERSPARK_BACKUP_DIR:-/run/aetherspark/backup}"
        target: /backup
        bind: { create_host_path: false }
      - type: bind
        source: "${AETHERSPARK_SECRETS_STORE:-/srv/aetherspark/secrets}"
        target: /backup/sealed
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: "${AETHERSPARK_PACKAGE_FEED:-/srv/aetherspark/packages}"
        target: /backup/feed
        read_only: true
        bind: { create_host_path: false }
    mem_limit: 512m
    pids_limit: 100
    networks: [backup]

  # The job as the repository's owner, for a machine that has lost its sealed store (backup.sh
  # restore-secrets): no key of AetherSpark's mounted, so restic asks for the repository's original
  # password on the terminal (the owner's, from the password manager)
  backup-owner:
    <<: [*no-restart, *hardening]
    image: aetherspark/restic:local
    labels: { aetherspark.role: restic }
    profiles: [backup]
    user: "${AETHERSPARK_UID:-1000}:${AETHERSPARK_GID:-1000}"
    environment:
      RESTIC_REPOSITORY_FILE: /run/secrets/backup-repository
      RESTIC_CACHE_DIR: /cache
    secrets: [backup-repository]
    tmpfs:
      - "/cache:uid=${AETHERSPARK_UID:-1000},gid=${AETHERSPARK_GID:-1000},mode=0700"
      - /tmp
    volumes:
      - type: bind
        source: "${AETHERSPARK_BACKUP_DIR:-/run/aetherspark/backup}"
        target: /backup
        bind: { create_host_path: false }
    mem_limit: 512m
    pids_limit: 100
    networks: [backup]

  # Copies the CA volume to and from the staging folder (step-ca stopped meanwhile); no network
  backup-files:
    <<: [*no-restart, *hardening]
    image: aetherspark/restic:local
    labels: { aetherspark.role: restic }
    profiles: [backup]
    user: "${AETHERSPARK_UID:-1000}:${AETHERSPARK_GID:-1000}"
    network_mode: none
    volumes:
      - step-ca:/ca
      - type: bind
        source: "${AETHERSPARK_BACKUP_DIR:-/run/aetherspark/backup}"
        target: /backup
        bind: { create_host_path: false }

# Files in the in-memory folder (`just secrets unseal`); the lint accepts no other source
secrets:
  step-ca-password:
    file: "${AETHERSPARK_SECRETS_DIR:-${XDG_RUNTIME_DIR}/aetherspark/secrets}/step-ca-password"
  step-ca-provisioner-postgres-auth:
    file: "${AETHERSPARK_SECRETS_DIR:-${XDG_RUNTIME_DIR}/aetherspark/secrets}/step-ca-provisioner-postgres-auth"
  postgres-auth-superuser-password:
    file: "${AETHERSPARK_SECRETS_DIR:-${XDG_RUNTIME_DIR}/aetherspark/secrets}/postgres-auth-superuser-password"
  keycloak-db-password:
    file: "${AETHERSPARK_SECRETS_DIR:-${XDG_RUNTIME_DIR}/aetherspark/secrets}/keycloak-db-password"
  step-ca-provisioner-keycloak:
    file: "${AETHERSPARK_SECRETS_DIR:-${XDG_RUNTIME_DIR}/aetherspark/secrets}/step-ca-provisioner-keycloak"
  keycloak.conf:
    file: "${AETHERSPARK_SECRETS_DIR:-${XDG_RUNTIME_DIR}/aetherspark/secrets}/keycloak.conf"
  step-ca-provisioner-forward-auth:
    file: "${AETHERSPARK_SECRETS_DIR:-${XDG_RUNTIME_DIR}/aetherspark/secrets}/step-ca-provisioner-forward-auth"
  step-ca-provisioner-whoami:
    file: "${AETHERSPARK_SECRETS_DIR:-${XDG_RUNTIME_DIR}/aetherspark/secrets}/step-ca-provisioner-whoami"
  forward-auth-client-secret:
    file: "${AETHERSPARK_SECRETS_DIR:-${XDG_RUNTIME_DIR}/aetherspark/secrets}/forward-auth-client-secret"
  forward-auth-cookie-secret:
    file: "${AETHERSPARK_SECRETS_DIR:-${XDG_RUNTIME_DIR}/aetherspark/secrets}/forward-auth-cookie-secret"
  backup-repository:
    file: "${AETHERSPARK_SECRETS_DIR:-${XDG_RUNTIME_DIR}/aetherspark/secrets}/backup-repository"
  backup-key-password:
    file: "${AETHERSPARK_SECRETS_DIR:-${XDG_RUNTIME_DIR}/aetherspark/secrets}/backup-key-password"

# Created and given to the stack user by `just up` (deploy/ca/ca.py volumes)
volumes:
  step-ca: {}
  postgres-auth-tls: {}
  postgres-auth-data: {}
  keycloak-tls: {}
  forward-auth-tls: {}
  whoami-tls: {}

networks:
  # A fixed subnet, so that the source address Traefik sees from the host is known (its gateway)
  ingress:
    enable_ipv6: false
    driver_opts: { com.docker.network.bridge.name: as-ingress }
    ipam: { config: [{ subnet: 172.30.30.0/24, gateway: 172.30.30.1 }] }
  # Traefik and Keycloak only (compose-base.md, "Network membership"), both at fixed addresses
  auth-front:
    internal: true
    enable_ipv6: false
    driver_opts: { com.docker.network.bridge.name: as-auth-front }
    ipam: { config: [{ subnet: 172.30.61.0/24, gateway: 172.30.61.1, ip_range: 172.30.61.128/25 }] }
  pki:
    internal: true
    enable_ipv6: false
    driver_opts: { com.docker.network.bridge.name: as-pki }
    ipam: { config: [{ subnet: 172.30.50.0/24, gateway: 172.30.50.1 }] }
  # Keycloak (PR 5) and its database only; the subnet is the one postgres-auth/pg_hba.conf admits
  db-auth:
    internal: true
    enable_ipv6: false
    driver_opts: { com.docker.network.bridge.name: as-db-auth }
    ipam: { config: [{ subnet: 172.30.60.0/24, gateway: 172.30.60.1 }] }
  # Traefik and the apps behind it (forward-auth and Gate G3's test page); Traefik at a fixed address
  edge:
    internal: true
    enable_ipv6: false
    driver_opts: { com.docker.network.bridge.name: as-edge }
    ipam: { config: [{ subnet: 172.30.63.0/24, gateway: 172.30.63.1, ip_range: 172.30.63.128/25 }] }
  # The back channel of the edge group: its services reach Keycloak's protocol paths through Traefik's
  # back-channel entrypoint (forward-auth.yml admits this subnet only)
  auth-edge:
    internal: true
    enable_ipv6: false
    driver_opts: { com.docker.network.bridge.name: as-auth-edge }
    ipam: { config: [{ subnet: 172.30.62.0/24, gateway: 172.30.62.1, ip_range: 172.30.62.128/25 }] }
  # The backup job's way to the backup target (egress.md, `backup`): not internal; on the Spark and
  # in CI the host rules let it reach only the target's address and port
  backup:
    enable_ipv6: false
    driver_opts: { com.docker.network.bridge.name: as-backup }
    ipam: { config: [{ subnet: 172.30.40.0/24, gateway: 172.30.40.1 }] }
