# postgres-data's client authentication (docs/architecture/data-plane.md, section 7). First match
# wins. The ingester and the pipeline only, over TLS, from the ingest network (172.30.70.0/24 in the
# stack's Compose file; the tests check that the two agree). The superuser and the migration owner
# only on the container's own socket, which no other container can reach. Everything else is
# refused, plain connections too.
#
# TYPE   DATABASE  USER        ADDRESS          METHOD
local    postgres  postgres                     scram-sha-256
local    research  postgres                     scram-sha-256
local    research  data_owner                   scram-sha-256
local    all       all                          reject
hostssl  research  ingester    172.30.70.0/24   scram-sha-256
hostssl  research  pipeline    172.30.70.0/24   scram-sha-256
host     all       all         0.0.0.0/0        reject
host     all       all         ::/0             reject
