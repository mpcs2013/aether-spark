# postgres-auth's client authentication (docs/architecture/compose-base.md, "postgres-auth").
# First match wins. Keycloak only, over TLS, from the db-auth network (172.30.60.0/24 in the stack's
# Compose file; the tests check that the two agree). The superuser only on the container's own
# socket, which no other container can reach. Everything else is refused, plain connections too.
#
# TYPE   DATABASE  USER      ADDRESS          METHOD
local    postgres  postgres                   scram-sha-256
local    all       all                        reject
hostssl  keycloak  keycloak  172.30.60.0/24   scram-sha-256
host     all       all       0.0.0.0/0        reject
host     all       all       ::/0             reject
