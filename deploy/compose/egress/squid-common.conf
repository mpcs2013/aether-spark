# Shared by both egress proxies (docs/architecture/egress.md). Each proxy's own file defines
# `http_port` (its internal address only) and the `clients` ACL, then includes this file.

acl SSL_port port 443
acl CONNECT method CONNECT
acl step1 at_step SslBump1

# Exact host names from /etc/squid/allowlist.txt; -n: never a reverse lookup for IP literals
acl allowed_host dstdomain -n "/etc/squid/allowlist.txt"
# The name the client put into its TLS ClientHello (SNI); no SNI never matches
acl allowed_sni ssl::server_name --client-requested "/etc/squid/allowlist.txt"

# IPv4 (dotted or integer), bracketed IPv6, hex forms; names ending in a dot
acl ip_literal dstdom_regex -n ^[0-9.]+$ ^\[ ^0x
acl odd_name dstdom_regex -n \.$

# Everything a tunnel must satisfy before Squid opens it
acl permitted all-of clients CONNECT SSL_port allowed_host !ip_literal !odd_name

http_access deny manager
http_access allow permitted
http_access deny all

# SNI check without decryption: peek at the ClientHello, splice allowlisted names, terminate the
# rest. A CONNECT refused above never reaches these rules: on an ssl-bump port Squid 6 always
# accepts it (200), opens no upstream connection and serves its 403 inside TLS under the
# throwaway certificate (see entrypoint.sh). The log shows TCP_DENIED.
ssl_bump peek step1
ssl_bump splice allowed_sni
ssl_bump terminate all

# No cache, no neighbours, no ICMP pinger, nothing added to requests
cache deny all
cache_mem 0 MB
icp_port 0
htcp_port 0
snmp_port 0
pinger_enable off
via off
forwarded_for delete

# One line per request; query strings stripped; bytes in both directions for the upload alert
strip_query_terms on
logformat egress %ts.%03tu client=%>a method=%rm target=%ru sni=%ssl::>sni status=%>Hs result=%Ss up=%>st down=%<st
access_log stdio:/dev/stdout egress
cache_log stdio:/dev/stderr

pid_filename /tmp/squid.pid
coredump_dir /tmp
shutdown_lifetime 1 seconds
