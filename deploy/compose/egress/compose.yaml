# Egress proxies and their networks (docs/architecture/egress.md, WP3n.3). Joins the stack overlay in
# P3a; until then it runs on its own for the egress tests (tests/egress/).
name: aetherspark-egress

x-proxy: &proxy
  build: .
  image: aetherspark/egress-proxy:local
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 256m
  pids_limit: 200
  restart: unless-stopped
  # Healthy once Squid accepts connections on its configured address, so `up --wait` means usable
  healthcheck:
    test: ["CMD", "bash", "-c", "a=$$(awk '/^http_port/ {print $$2; exit}' /etc/squid/squid.conf); exec 3<>/dev/tcp/$${a%:*}/$${a##*:}"]
    interval: 30s
    timeout: 3s
    start_period: 30s
    start_interval: 1s

services:
  egress-runtime:
    <<: *proxy
    labels: { aetherspark.role: runtime-proxy }   # its row in the membership matrix (deploy/compose/policy.json)
    volumes:
      - ./runtime.conf:/etc/squid/squid.conf:ro
      - ./runtime.allowlist:/etc/squid/allowlist.txt:ro
    networks:
      egress-runtime: { ipv4_address: 172.30.10.2 }
      out-runtime: {}

  egress-ops:
    <<: *proxy
    profiles: [egress-ops]
    labels: { aetherspark.role: ops-proxy }
    volumes:
      - ./ops.conf:/etc/squid/squid.conf:ro
      - ./ops.allowlist:/etc/squid/allowlist.txt:ro
    networks:
      egress-ops: { ipv4_address: 172.30.20.2 }
      out-ops: {}

  # One-shot model pull (ADR-0006 "Model files"): one model at its pinned revision through the ops
  # proxy into /srv/models, every file checked against deploy/models/<name>.sha256. On the Spark,
  # in an owner-started session:
  #   docker compose -f deploy/compose/egress/compose.yaml --profile egress-ops --profile model-pull \
  #     run --rm model-pull <name>
  model-pull:
    profiles: [model-pull]
    image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    labels: { aetherspark.role: pull-job }
    # Root only to write into the root-owned model store; every capability dropped
    user: "0:0"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 50
    environment:
      HTTPS_PROXY: http://172.30.20.2:3128
    entrypoint: ["sh", "/model-pull.sh"]
    volumes:
      - ./model-pull.sh:/model-pull.sh:ro
      - ../../models:/manifests:ro
      - /srv/models:/models
    networks: [egress-ops]
    depends_on:
      egress-ops: { condition: service_healthy }

# Bridge names start with `as-` so the host rules (deploy/host/egress-rules.sh) can tell the
# networks apart; `as-out-*` and `as-backup` are the only ones with a way out.
networks:
  # Clients reach the proxies here; no route out (layer 1). The host is .1 (without `gateway`,
  # Docker would take the range's first address); clients get addresses from the upper half only,
  # so the proxy's fixed address is never handed out first.
  egress-runtime:
    internal: true
    enable_ipv6: false
    driver_opts: { com.docker.network.bridge.name: as-eg-runtime }
    ipam: { config: [{ subnet: 172.30.10.0/24, gateway: 172.30.10.1, ip_range: 172.30.10.128/25 }] }
  egress-ops:
    internal: true
    enable_ipv6: false
    driver_opts: { com.docker.network.bridge.name: as-eg-ops }
    ipam: { config: [{ subnet: 172.30.20.0/24, gateway: 172.30.20.1, ip_range: 172.30.20.128/25 }] }
  # The proxies' way out; layer 3 limits it to public addresses on 443 and the resolver on 53
  out-runtime:
    enable_ipv6: false
    driver_opts: { com.docker.network.bridge.name: as-out-runtime }
  out-ops:
    enable_ipv6: false
    driver_opts: { com.docker.network.bridge.name: as-out-ops }
