# Drop-in for docker.service (/etc/systemd/system/docker.service.d/): after every Docker start,
# put the layer-3 jumps back in front (Docker re-inserts its own) and fail the start if the rules
# or Docker's firewall backend are not as required (docs/architecture/egress.md). A check after
# the fact, not a gate: dockerd starts restart-policy containers before it reports ready; the
# rules are already there from the unit that runs before Docker. The script reads its own
# settings file, so dockerd's environment stays untouched.
[Service]
ExecStartPost=/usr/local/sbin/aetherspark-egress-rules apply
