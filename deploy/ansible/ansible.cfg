# Ansible's settings for the Spark host role (deploy/ansible/run.sh runs from this folder)
[defaults]
# The inventory is the Spark itself, given by run.sh (-i localhost,): a value here would be read as
# a path and the folder, with host.example.yml, parsed as an inventory
roles_path = roles
# The system Python, which has the apt bindings the apt tasks need
interpreter_python = /usr/bin/python3
retry_files_enabled = false
# A run that fails partway still runs the restarts it queued; a rerun finds the files unchanged and
# would not queue them again (e.g. sshd would keep its old settings)
force_handlers = true
# Collections only from the locked Ansible package in the virtual environment, never a copy found
# elsewhere on the machine (no such path exists)
collections_path = /nonexistent/aetherspark-no-collections
nocows = true
display_skipped_hosts = false
