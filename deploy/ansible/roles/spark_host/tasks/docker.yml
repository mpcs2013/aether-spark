---
# The Docker daemon's image pulls go through the ops proxy (flow H7); its DNS and userland-proxy
# settings come from deploy/host/install.sh, which keeps the other keys.
- name: Check for Docker's settings
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
  register: spark_host_daemon_json

- name: Read Docker's settings
  ansible.builtin.slurp:
    path: /etc/docker/daemon.json
  register: spark_host_daemon_json_content
  when: spark_host_daemon_json.stat.exists

- name: Docker pulls images through the ops proxy
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ spark_host_daemon_settings | combine({'proxies': spark_host_daemon_proxies}) | to_nice_json(indent=2) }}\n"
    owner: root
    group: root
    mode: "0644"
  vars:
    spark_host_daemon_settings: >-
      {{ (spark_host_daemon_json_content.content | b64decode | from_json)
         if spark_host_daemon_json.stat.exists else {} }}
    spark_host_daemon_proxies:
      http-proxy: "http://{{ spark_host_ops_proxy }}"
      https-proxy: "http://{{ spark_host_ops_proxy }}"
  notify: Restart Docker
