---
# The host's folder for its own settings and its age key (ADR-0010): root only. The key's offline
# recovery copy goes with the other offline key; the backup job (P3a) leaves this folder out.
- name: The host's settings folder is root's only
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /etc/aetherspark
    - /etc/aetherspark/age

- name: The host's age key exists
  ansible.builtin.command: age-keygen -o /etc/aetherspark/age/host.key
  args:
    creates: /etc/aetherspark/age/host.key

- name: The host's age key is root's only, read-only
  ansible.builtin.file:
    path: /etc/aetherspark/age/host.key
    owner: root
    group: root
    mode: "0400"
