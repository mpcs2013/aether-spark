---
# Names: every program asks systemd-resolved, which sends only home.arpa names to the router (flow
# H5). Time from the listed public time servers only (H6). NetworkManager makes no connectivity
# checks and leaves the radios and the ConnectX ports alone. IPv6 off everywhere.
- name: Directories for the resolver, time and NetworkManager settings
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/systemd/resolved.conf.d
    - /etc/systemd/timesyncd.conf.d
    - /etc/NetworkManager/conf.d

- name: Resolver without fallback servers, LLMNR or mDNS
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/90-aetherspark.conf
    content: |
      # docs/architecture/spark-host.md, flow H5; written by the host role. The router comes from
      # the LAN connection, with the route-only domain ~home.arpa, so no other name is resolved.
      [Resolve]
      FallbackDNS=
      LLMNR=no
      MulticastDNS=no
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-resolved

# The router does not answer time requests from the AetherSpark network (A-012, Q1): the public
# time servers, by address, since the host resolves no internet names
- name: Time from the listed public time servers only
  ansible.builtin.copy:
    dest: /etc/systemd/timesyncd.conf.d/90-aetherspark.conf
    content: |
      # docs/architecture/spark-host.md, flow H6; written by the host role
      [Time]
      NTP={{ spark_host_ntp_servers | join(' ') }}
      FallbackNTP=
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-timesyncd

# dns=none: NetworkManager 1.46 makes any link with name servers and the default route the
# resolver's default route, with no setting to stop it, and repeats that at every DNS update. So it
# hands the resolver nothing, and the LAN hook below gives the link exactly what flow H5 allows.
- name: NetworkManager hands no DNS to the resolver, makes no connectivity checks, leaves radios and ConnectX ports alone
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/90-aetherspark.conf
    content: |
      # docs/architecture/spark-host.md, "Interfaces" and flow H5; written by the host role
      [main]
      dns=none

      [connectivity]
      enabled=false

      [keyfile]
      unmanaged-devices={{ spark_host_unmanaged_devices }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart NetworkManager

- name: IPv6 off on every interface
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/90-aetherspark-ipv6.conf
    reload: true
  loop:
    - net.ipv6.conf.all.disable_ipv6
    - net.ipv6.conf.default.disable_ipv6

- name: Every program asks the local resolver
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  when: spark_host_manage_network | bool

- name: Read the LAN connection's name and IPv6 settings
  ansible.builtin.command: >-
    nmcli -g ipv4.dns,ipv4.dns-search,ipv4.ignore-auto-dns,ipv6.method
    connection show {{ spark_host_lan_connection | quote }}
  register: spark_host_lan_settings
  changed_when: false
  check_mode: false
  when: spark_host_manage_network | bool

# NetworkManager's own IPv6 setting, or it would switch disable_ipv6 back on for the LAN port
- name: The LAN connection uses the router for home.arpa only, without IPv6
  ansible.builtin.command: >-
    nmcli connection modify {{ spark_host_lan_connection | quote }}
    ipv4.dns {{ spark_host_router }} ipv4.dns-search ~home.arpa ipv4.ignore-auto-dns yes
    ipv6.method disabled
  when:
    - spark_host_manage_network | bool
    - spark_host_lan_settings.stdout_lines != [spark_host_router, '~home.arpa', 'yes', 'disabled']
  changed_when: true
  notify: Reapply the LAN connection

# The LAN hook: with dns=none above, this alone tells systemd-resolved about the LAN link. Run by
# NetworkManager's dispatcher when the link comes up, and after systemd-resolved starts (it forgets
# link settings on a restart). Without the link it does nothing; until it has run, names fail
# closed (no server for anything).
- name: The LAN hook gives the resolver the router, for home.arpa only, never the default route
  ansible.builtin.copy:
    dest: /usr/local/sbin/aetherspark-lan-dns
    content: |
      #!/bin/sh
      # docs/architecture/spark-host.md, flow H5; written by the host role. NetworkManager hands no
      # DNS to systemd-resolved (dns=none), so this sets the LAN link: the router as its only
      # server, the route-only domain ~home.arpa, never the resolver's default route.
      set -eu
      dev="$(nmcli -g GENERAL.DEVICES connection show {{ spark_host_lan_connection | quote }} 2>/dev/null || true)"
      [ -n "$dev" ] || exit 0
      resolvectl dns "$dev" {{ spark_host_router | quote }}
      resolvectl domain "$dev" '~home.arpa'
      resolvectl default-route "$dev" false
      resolvectl llmnr "$dev" false
      resolvectl mdns "$dev" false
    owner: root
    group: root
    mode: "0755"
  notify: Apply the LAN hook

- name: Folder for NetworkManager's dispatcher scripts
  ansible.builtin.file:
    path: /etc/NetworkManager/dispatcher.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: NetworkManager runs the LAN hook when a link comes up
  ansible.builtin.copy:
    dest: /etc/NetworkManager/dispatcher.d/90-aetherspark-lan-dns
    content: |
      #!/bin/sh
      # Written by the host role: the LAN hook (/usr/local/sbin/aetherspark-lan-dns) after a link
      # comes up or its address changes
      case "$2" in
        up|reapply|dhcp4-change) exec /usr/local/sbin/aetherspark-lan-dns ;;
      esac
      exit 0
    owner: root
    group: root
    mode: "0755"

- name: Folder for systemd-resolved's settings
  ansible.builtin.file:
    path: /etc/systemd/system/systemd-resolved.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: The resolver runs the LAN hook after it starts
  ansible.builtin.copy:
    dest: /etc/systemd/system/systemd-resolved.service.d/90-aetherspark-lan-dns.conf
    content: |
      # Written by the host role: a restarted resolver has forgotten the LAN link's settings
      [Service]
      ExecStartPost=-/usr/local/sbin/aetherspark-lan-dns
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
