---
# Read-only assertions, also in check mode (spark-host.md, "Drift"): check mode skips command tasks,
# and some settings can drift without a file changing. Each one fails when its setting has drifted;
# tests/host-role/run.sh breaks each in turn and expects its failure.
- name: Read the masked units' state
  ansible.builtin.command: systemctl is-enabled {{ spark_host_masked_units | join(' ') }}  # noqa: command-instead-of-module
  register: spark_host_assert_units
  changed_when: false
  failed_when: false
  check_mode: false

# One line per unit: a unit that is neither installed nor masked can print no line at all
- name: Assert every unit that phones home is masked
  ansible.builtin.assert:
    that:
      - spark_host_assert_units.stdout_lines | length == spark_host_masked_units | length
      - spark_host_assert_units.stdout_lines | reject('equalto', 'masked') | list | length == 0
    fail_msg: >-
      not masked: {{ spark_host_masked_units | zip(spark_host_assert_units.stdout_lines)
      | rejectattr(1, 'equalto', 'masked') | map('first') | join(', ') }}
    quiet: true

- name: Read the default target
  ansible.builtin.command: systemctl get-default
  register: spark_host_assert_target
  changed_when: false
  check_mode: false

- name: Assert the host boots to a text login
  ansible.builtin.assert:
    that: spark_host_assert_target.stdout == 'multi-user.target'
    fail_msg: "the default target is {{ spark_host_assert_target.stdout }}"
    quiet: true

# sshd -T prints the settings sshd would use, whichever file sets them; it needs the runtime
# directory that the on-demand sshd creates only at the first connection
- name: The runtime directory of sshd exists for the settings check
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"
  check_mode: false
  # Gone at every reboot until the first SSH connection: re-creating it is not drift
  changed_when: false

- name: Read the SSH settings in effect
  ansible.builtin.command: /usr/sbin/sshd -T
  register: spark_host_assert_sshd
  changed_when: false
  check_mode: false

- name: Assert the SSH settings in effect
  ansible.builtin.assert:
    that: spark_host_sshd_expected | difference(spark_host_assert_sshd.stdout_lines) | length == 0
    fail_msg: "not in effect: {{ spark_host_sshd_expected | difference(spark_host_assert_sshd.stdout_lines) | join(', ') }}"
    quiet: true
  vars:
    spark_host_sshd_expected:
      - authorizedkeysfile /etc/ssh/authorized_keys/%u
      - authorizedkeyscommand none
      - trustedusercakeys none
      - passwordauthentication no
      - kbdinteractiveauthentication no
      - permitrootlogin no
      - "allowusers {{ spark_host_admin_user }}"
      - allowtcpforwarding local
      - allowstreamlocalforwarding local
      - allowagentforwarding no
      - permittunnel no
      - x11forwarding no
      - gatewayports no

- name: Read the root-owned key file
  ansible.builtin.stat:
    path: "/etc/ssh/authorized_keys/{{ spark_host_admin_user }}"
  register: spark_host_assert_keyfile

- name: Read the keys sshd accepts
  ansible.builtin.slurp:
    path: "/etc/ssh/authorized_keys/{{ spark_host_admin_user }}"
  register: spark_host_assert_keys

- name: Assert the hardware keys are the only keys, each from the admin desktop only
  ansible.builtin.assert:
    that:
      - spark_host_keys | sort == spark_host_expected | sort
      - spark_host_assert_keyfile.stat.pw_name == 'root'
      - spark_host_assert_keyfile.stat.mode == '0644'
    fail_msg: >-
      the key file holds {{ spark_host_keys | length }} keys, expected the {{ spark_host_expected | length }}
      hardware keys, each with from= the admin desktop, in a root-owned 0644 file
    quiet: true
  vars:
    spark_host_keys: "{{ spark_host_assert_keys.content | b64decode | split('\n') | select | reject('match', '^#') | list }}"
    spark_host_expected: "{{ spark_host_admin_ssh_keys | map('regex_replace', '^', 'from=\"' ~ spark_host_admin_addr ~ '\" ') | list }}"

# Membership of the docker group is root without a password (NVIDIA's own setup guide suggests
# adding yourself): nobody is in it
- name: Read the docker group
  ansible.builtin.getent:
    database: group
    key: docker
    fail_key: false

- name: Assert nobody is in the docker group
  ansible.builtin.assert:
    that: spark_host_docker_members | length == 0
    fail_msg: >-
      the docker group has members ({{ spark_host_docker_members }}): membership is root without a
      password; use sudo docker instead (spark-host.md)
    quiet: true
  vars:
    spark_host_docker_members: "{{ ((ansible_facts.getent_group | default({})).get('docker') or ['', '', ''])[2] | default('', true) }}"

- name: Read the IPv6 switches
  ansible.builtin.command: sysctl -n net.ipv6.conf.all.disable_ipv6 net.ipv6.conf.default.disable_ipv6
  register: spark_host_assert_ipv6
  changed_when: false
  check_mode: false

- name: Assert IPv6 is off
  ansible.builtin.assert:
    that: spark_host_assert_ipv6.stdout_lines == ['1', '1']
    fail_msg: "disable_ipv6 (all, default): {{ spark_host_assert_ipv6.stdout_lines | join(', ') }}"
    quiet: true

- name: Read where /etc/resolv.conf points
  ansible.builtin.stat:
    path: /etc/resolv.conf
  register: spark_host_assert_resolv
  when: spark_host_manage_network | bool

- name: Assert every program asks the local resolver
  ansible.builtin.assert:
    that: spark_host_assert_resolv.stat.lnk_source | default('') == '/run/systemd/resolve/stub-resolv.conf'
    fail_msg: /etc/resolv.conf does not point to systemd-resolved's stub
    quiet: true
  when: spark_host_manage_network | bool

# No link is the resolver's default route, so only home.arpa names reach the router. NetworkManager
# can make the link with the default route a DNS default route; if this fails on the Spark, the
# role needs a fix (spark-host.md, S3)
- name: Read the resolver's links
  ansible.builtin.command: resolvectl status --no-pager
  register: spark_host_assert_resolved
  changed_when: false
  check_mode: false
  when: spark_host_manage_network | bool

- name: Assert no link is the resolver's default route
  ansible.builtin.assert:
    that: "'+DefaultRoute' not in spark_host_assert_resolved.stdout"
    fail_msg: a link is the resolver's default route, so names other than home.arpa would go to the router
    quiet: true
  when: spark_host_manage_network | bool

# Only on the Spark: the lists read at arrival are filled in, and no IPv6 address exists anywhere
- name: Read the loaded kernel modules and the IPv6 addresses
  ansible.builtin.command: "{{ item }}"
  loop:
    - cat /proc/modules
    - ip -6 -o address show
  register: spark_host_assert_kernel
  changed_when: false
  check_mode: false
  when: spark_host_manage_network | bool

- name: Assert the radio drivers are listed and none is loaded, and no interface has an IPv6 address
  ansible.builtin.assert:
    that:
      - spark_host_radio_modules | length > 0
      - spark_host_loaded | intersect(spark_host_radio_modules) | length == 0
      - spark_host_assert_kernel.results[1].stdout | length == 0
    fail_msg: >-
      radio drivers listed: {{ spark_host_radio_modules | length }} (read them at arrival), loaded:
      {{ spark_host_loaded | intersect(spark_host_radio_modules) | join(', ') or 'none' }}; IPv6 addresses:
      {{ spark_host_assert_kernel.results[1].stdout_lines | length }}
    quiet: true
  vars:
    spark_host_loaded: "{{ spark_host_assert_kernel.results[0].stdout_lines | map('split') | map('first') | list }}"
  when: spark_host_manage_network | bool

# Set by a command, so check mode cannot see it drift (back to automatic DNS, or IPv6 on)
- name: Read the LAN connection's name and IPv6 settings
  ansible.builtin.command: >-
    nmcli -g ipv4.dns,ipv4.dns-search,ipv4.ignore-auto-dns,ipv6.method
    connection show {{ spark_host_lan_connection | quote }}
  register: spark_host_assert_lan
  changed_when: false
  check_mode: false
  when: spark_host_manage_network | bool

- name: Assert the LAN connection uses the router for home.arpa only, without IPv6
  ansible.builtin.assert:
    that: spark_host_assert_lan.stdout_lines == [spark_host_router, '~home.arpa', 'yes', 'disabled']
    fail_msg: "the LAN connection has DNS, search, ignore-auto-dns, IPv6: {{ spark_host_assert_lan.stdout_lines | join(', ') }}"
    quiet: true
  when: spark_host_manage_network | bool

- name: Check for the rfkill device
  ansible.builtin.stat:
    path: /dev/rfkill
  register: spark_host_assert_rfkill_dev

- name: Read the radios' state
  ansible.builtin.command: rfkill --raw --noheadings --output SOFT
  register: spark_host_assert_rfkill
  changed_when: false
  check_mode: false
  when: spark_host_assert_rfkill_dev.stat.exists

- name: Assert every radio is blocked
  ansible.builtin.assert:
    that: "'unblocked' not in spark_host_assert_rfkill.stdout_lines"
    fail_msg: a radio is unblocked
    quiet: true
  when: spark_host_assert_rfkill_dev.stat.exists

- name: Read the host's age key
  ansible.builtin.stat:
    path: /etc/aetherspark/age/host.key
  register: spark_host_assert_age

- name: Assert the host's age key is root's only and read-only
  ansible.builtin.assert:
    that:
      - spark_host_assert_age.stat.exists
      - spark_host_assert_age.stat.pw_name == 'root'
      - spark_host_assert_age.stat.mode == '0400'
    fail_msg: "/etc/aetherspark/age/host.key is missing or not root-only 0400"
    quiet: true

- name: Read where node-exporter listens
  ansible.builtin.command: ss -Hltn sport = :9100
  register: spark_host_assert_exporter
  changed_when: false
  check_mode: false

- name: Assert node-exporter listens on loopback only
  ansible.builtin.assert:
    that:
      - spark_host_assert_exporter.stdout_lines | length > 0
      - spark_host_assert_exporter.stdout_lines | map('split') | map(attribute=3) | reject('match', '^127\.0\.0\.1:') | list | length == 0
    fail_msg: "node-exporter is not running, or listens beyond loopback: {{ spark_host_assert_exporter.stdout_lines | join('; ') }}"
    quiet: true

- name: Gather the installed packages
  ansible.builtin.package_facts:

- name: Read the held packages
  ansible.builtin.command: apt-mark showhold
  register: spark_host_assert_holds
  changed_when: false
  check_mode: false

- name: Assert the pinned packages are held
  ansible.builtin.assert:
    that: spark_host_held | difference(spark_host_assert_holds.stdout_lines) | length == 0
    fail_msg: "not held: {{ spark_host_held | difference(spark_host_assert_holds.stdout_lines) | join(', ') }}"
    quiet: true
  vars:
    spark_host_held: "{{ spark_host_held_packages | intersect(ansible_facts.packages.keys()) }}"

- name: Check for the Ubuntu Pro client
  ansible.builtin.stat:
    path: /usr/bin/pro
  register: spark_host_assert_pro

- name: Read the Ubuntu Pro news setting
  ansible.builtin.command: pro config show apt_news
  register: spark_host_assert_apt_news
  changed_when: false
  check_mode: false
  when: spark_host_assert_pro.stat.exists

- name: Assert no Ubuntu Pro news in apt
  ansible.builtin.assert:
    that: "'False' in spark_host_assert_apt_news.stdout"
    fail_msg: Ubuntu Pro's apt news is on
    quiet: true
  when: spark_host_assert_pro.stat.exists

- name: Check the layer-3 rules in host mode
  ansible.builtin.command: /usr/local/sbin/aetherspark-egress-rules check
  environment:
    AS_REQUIRE_HOST_MODE: "1"
  changed_when: false
  check_mode: false
  when: spark_host_apply_rules | bool

- name: Read whether the rules check runs on its timer
  ansible.builtin.command: systemctl is-enabled aetherspark-egress-check.timer  # noqa: command-instead-of-module
  register: spark_host_assert_timer
  changed_when: false
  failed_when: false
  check_mode: false
  when: spark_host_apply_rules | bool

- name: Assert the rules check runs on its timer
  ansible.builtin.assert:
    that: spark_host_assert_timer.stdout == 'enabled'
    fail_msg: "aetherspark-egress-check.timer is {{ spark_host_assert_timer.stdout }}, not enabled"
    quiet: true
  when: spark_host_apply_rules | bool
