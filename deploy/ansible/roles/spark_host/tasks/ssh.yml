---
# One admin account with a hardware key (spark-host.md, "SSH and the admin account"). Its password,
# set at first boot and kept in the password manager, is for the console and sudo only.
- name: The admin account may use sudo
  ansible.builtin.user:
    name: "{{ spark_host_admin_user }}"
    groups: sudo
    append: true

- name: The admin account's only key is the hardware key, from the admin desktop only
  ansible.posix.authorized_key:
    user: "{{ spark_host_admin_user }}"
    key: "{{ spark_host_admin_ssh_key }}"
    key_options: 'from="{{ spark_host_admin_addr }}"'
    exclusive: true

# sshd -t needs its runtime directory, which Ubuntu's on-demand sshd (ssh.socket) creates only at
# the first connection; a runtime directory, gone at reboot, so also made in check mode
- name: The runtime directory of sshd exists for the settings check
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"
  check_mode: false

# sshd takes the first value it reads; this file comes before Ubuntu's own (50-cloud-init.conf)
- name: SSH settings
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-aetherspark.conf
    content: |
      # docs/architecture/spark-host.md, "SSH and the admin account"; written by the host role.
      # Forwarding only from the desktop to the Spark: a remote forward would give Spark processes
      # a way out through the desktop, agent forwarding the desktop's key to root on the Spark.
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowUsers {{ spark_host_admin_user }}
      AllowTcpForwarding local
      AllowStreamLocalForwarding local
      AllowAgentForwarding no
      PermitTunnel no
      X11Forwarding no
      GatewayPorts no
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
