---
# The Spark host role (docs/architecture/spark-host.md). The firewall's host mode comes last, so
# everything before it can still reach what it needs; the assertions run on every run and in check
# mode, since check mode skips command tasks.
- name: The host's settings are complete
  ansible.builtin.assert:
    that:
      - spark_host_admin_user | length > 0
      - spark_host_admin_ssh_keys | length > 0
      - spark_host_admin_ssh_keys | reject('match', '^sk-(ssh-ed25519|ecdsa-sha2-nistp256)@openssh.com ') | list | length == 0
      - spark_host_admin_addr is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
      - spark_host_router is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
      - not spark_host_manage_network or spark_host_lan_connection | length > 0
      - spark_host_ups_port | string | length == 0 or (spark_host_nas_addr | length > 0 and spark_host_ups_user | length > 0)
    fail_msg: >-
      /etc/aetherspark/host.yml needs the admin user, the hardware keys' public lines (sk-...), the
      admin desktop's and the router's addresses, the LAN connection, and with a UPS port the NAS
      address and the UPS login (deploy/ansible/host.example.yml)
    quiet: true

# Before anything changes: a run that would stop at the end on a missing or open file stops here
- name: Read the host's settings files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ spark_host_settings_files }}"
  register: spark_host_settings_stat
  vars:
    spark_host_settings_files: >-
      {{ [spark_host_vars_file | default('/etc/aetherspark/host.yml')]
         + (['/etc/aetherspark/egress-rules.env'] if spark_host_apply_rules | bool else [])
         + (['/etc/aetherspark/ups.secret'] if spark_host_ups_port | string | length > 0 else []) }}

- name: The host's settings files are in place and root's only
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.pw_name == 'root'
      - item.stat.mode == '0600'
    fail_msg: >-
      {{ item.item }} is missing or not root-only 0600: copy it from the desktop's site folder
      (docs/runbooks/spark-host.md, step 3)
    quiet: true
  loop: "{{ spark_host_settings_stat.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Apt sources, proxy and schedule
  ansible.builtin.import_tasks: apt.yml
- name: Packages
  ansible.builtin.import_tasks: packages.yml
- name: Services switched off
  ansible.builtin.import_tasks: services.yml
- name: Network, names and time
  ansible.builtin.import_tasks: network.yml
- name: Radios
  ansible.builtin.import_tasks: radios.yml
- name: SSH and the admin account
  ansible.builtin.import_tasks: ssh.yml
# sshd's new settings at once: a later failure must not leave the running sshd on the old ones
- name: Reload sshd now
  ansible.builtin.meta: flush_handlers
- name: Docker daemon
  ansible.builtin.import_tasks: docker.yml
  when: spark_host_docker | bool
- name: Metrics and logs
  ansible.builtin.import_tasks: observability.yml
- name: UPS client
  ansible.builtin.import_tasks: ups.yml
  when: spark_host_ups_port | string | length > 0
- name: Secrets on the host
  ansible.builtin.import_tasks: secrets.yml
- name: Firewall host mode (last)
  ansible.builtin.import_tasks: firewall.yml
  when: spark_host_apply_rules | bool
# The restarts and reloads first, so the assertions see the state they leave
- name: Run the pending restarts and reloads
  ansible.builtin.meta: flush_handlers

- name: Assertions
  ansible.builtin.import_tasks: assert.yml
  tags: [assert]
