# `aspire run`'s client authentication for its development postgres-data, in place of the stack's
# deploy/compose/stack/postgres-data/pg_hba.conf. One difference only: the ingester and the pipeline
# run on this machine, not on the stack's ingest network, so their connections arrive through
# Aspire's port proxy from the container runtime's own address, which no file can name in advance.
# They still sign in over TLS with their passwords only; the superuser and the migration owner still
# only on the container's own socket; plain connections are still refused.
#
# TYPE   DATABASE  USER        ADDRESS          METHOD
local    postgres  postgres                     scram-sha-256
local    research  postgres                     scram-sha-256
local    research  data_owner                   scram-sha-256
local    all       all                          reject
hostssl  research  ingester    0.0.0.0/0        scram-sha-256
hostssl  research  pipeline    0.0.0.0/0        scram-sha-256
host     all       all         0.0.0.0/0        reject
host     all       all         ::/0             reject
