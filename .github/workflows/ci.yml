name: ci

# Pull requests only: with "branch must be up to date" (ruleset), the merged tree is the tree a PR
# tested, so a second run on main would only repeat it. Manual runs test everything.
on:
  pull_request:
  workflow_dispatch:

# ADR-0004: read-only GITHUB_TOKEN, no other secrets
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which jobs a change needs. A change to this workflow, or a manual run, runs everything.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.c.outputs.code }}
      python: ${{ steps.c.outputs.python }}
      devcontainer: ${{ steps.c.outputs.devcontainer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: c
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$EVENT" != pull_request ]; then
            printf 'code=true\npython=true\ndevcontainer=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          printf '%s\n' "$files"
          # Code: anything beyond docs and repo settings; the other filters look at these files only
          code_files=$(printf '%s\n' "$files" | grep -Ev '^$|^(docs/|LICENSE$|\.vscode/|\.github/rulesets/|\.github/dependabot\.yml$)|\.md$' || true)
          any() { printf '%s\n' "$code_files" | grep -Eq "$1"; }
          all=false; any '^\.github/workflows/' && all=true
          code=$all; [ -n "$code_files" ] && code=true
          # Python on Windows: the workstation jobs and the Python workspace
          python=$all; any '^(src/python/|deploy/workstation/|tests/python/|\.githooks/)|^(pyproject\.toml|uv\.lock|\.python-version|justfile)$' && python=true
          # Dev container: its definition and the toolchain pins it builds on
          devcontainer=$all; any '^\.devcontainer/|^(global\.json|\.python-version|justfile|Directory\.(Build|Packages)\.props|nuget\.config|pyproject\.toml|uv\.lock)$' && devcontainer=true
          printf 'code=%s\npython=%s\ndevcontainer=%s\n' "$code" "$python" "$devcontainer" | tee -a "$GITHUB_OUTPUT"

  build:
    name: just ci (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0

      - run: just ci

  # The dev container builds and passes `just ci` on both architectures (WP2.4; arm64 = the Spark)
  devcontainer:
    name: devcontainer (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: docker build -t aetherspark-dev .devcontainer

      # The container user (uid 1654) differs from the runner's; it writes tool caches here
      - run: chmod -R a+rwX .

      - run: >
          docker run --rm -v "$PWD:/workspace" -w /workspace aetherspark-dev
          sh -c 'git config --global --add safe.directory /workspace && just ci'

  # Windows-only checks of the workstation jobs (reparse points, junctions, file ids)
  python-windows:
    name: just py-ci (windows)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0

      - run: just py-ci

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Image pinned by digest (ADR-0005); full history, findings redacted in the log
      - run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --no-banner --redact .

  # The one required check: fails if any job failed or was cancelled; a job skipped because its
  # area did not change counts as passed. Jobs skipped by `if` report no check of their own, so
  # requiring them directly would leave docs-only PRs pending forever.
  ci-result:
    if: always()
    needs: [changes, build, devcontainer, python-windows, gitleaks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then exit 1; fi
