# Grouped and weekly to keep Actions minutes low (lesson from Decisya, O-012)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # Base and tool images in Dockerfiles, tag and digest together (ADR-0005, #31). The dev
  # container's SDK image may move ahead of global.json, which names the minimum.
  - package-ecosystem: docker
    directories:
      - /.devcontainer
      - /deploy/compose/egress
      - /deploy/compose/stack/step-ca
      - /deploy/compose/stack/postgres-auth
      - /deploy/compose/stack/forward-auth
      - /deploy/compose/stack/whoami
      - /deploy/keycloak   # its base is ignored below
      - /tests/egress/lab
      - /tests/host-role
      - /deploy/images   # grype.Dockerfile: the scanner's pin
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
    # New digests and patches only for these: Ubuntu stays on 24.04 (the DGX OS userland, and the
    # egress proxy's package pins come from noble-security), and the SDK image stays on global.json's
    # major. A move is a deliberate change, not a weekly update.
    ignore:
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: mcr.microsoft.com/dotnet/sdk
        update-types: ["version-update:semver-major"]
      - dependency-name: mcr.microsoft.com/dotnet/runtime-deps
        update-types: ["version-update:semver-major"]
      # A Postgres major version needs its data folder upgraded (pg_upgrade or dump and restore): a
      # deliberate change with its own runbook, never a weekly bump
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # Keycloak's base moves only with Ostium's release notice (exchange D-008, ADR-0009 amendment 3)
      - dependency-name: quay.io/keycloak/keycloak

  # Test client images in the egress tests' Compose files
  - package-ecosystem: docker-compose
    directories:
      - /tests/egress
      - /deploy/compose/stack   # Traefik
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
