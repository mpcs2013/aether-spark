# Grouped and weekly to keep Actions minutes low (lesson from Decisya, O-012)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # Base and tool images in Dockerfiles, tag and digest together (ADR-0005, #31). The dev
  # container's SDK image may move ahead of global.json, which names the minimum.
  - package-ecosystem: docker
    directories:
      - /.devcontainer
      - /deploy/compose/egress
      - /tests/egress/lab
      - /tests/host-role
      - /deploy/images   # grype.Dockerfile: the scanner's pin
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]

  # Test client images in the egress tests' Compose files
  - package-ecosystem: docker-compose
    directories:
      - /tests/egress
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
