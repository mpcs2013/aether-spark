[project]
name = "aetherspark"
version = "0.0.0"
description = "AetherSpark workspace root (not published)"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["src/python/*"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]
host = [
    "ansible==14.5.0 ; sys_platform == 'linux'",
    "ansible-lint==26.10.1 ; sys_platform == 'linux'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["src/python", "deploy/workstation", "deploy/compose", "deploy/images", "tests/python"]
addopts = "-ra --strict-markers --strict-config"
