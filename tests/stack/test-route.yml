# Test route only (tests/stack/run.sh): Traefik's ping under whoami.aether.<place>/stack-test/, with
# a certificate ordered from step-ca over ACME. The real test page (forward-auth.yml) has the rest of
# the name; this route's longer rule wins for its path and asks no sign-in.
http:
  routers:
    test-whoami:
      rule: 'Host(`whoami.aether.{{ env "AETHERSPARK_PLACE" }}`) && PathPrefix(`/stack-test/`)'
      entryPoints: [websecure]
      service: ping@internal
      tls:
        certResolver: stepca
